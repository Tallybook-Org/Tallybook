services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tallybook
      POSTGRES_PASSWORD: tallybook
      POSTGRES_DB: tallybook
    ports:
      - "5432:5432"
    volumes:
      - tallybook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallybook -d tallybook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tallybook-postgres:
